name: ccpocket_preview
description: "Runs ccpocket on several devices side by side on macOS (multi_device_preview)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  ccpocket:
    path: ../mobile
  flutter:
    sdk: flutter
  marionette_flutter: ^0.7.0
  multi_device_preview: ^1.3.1
  multi_device_preview_marionette: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    # Same as apps/mobile: speech_to_text needs CocoaPods on macOS.
    enable-swift-package-manager: false
  assets:
    - assets/icon.png
    - assets/icon_light_outline.png
    - assets/icon_pro_copper_emerald.png
    - assets/docs/
    - assets/store/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/code/JetBrainsMono-Regular.ttf
    - family: IoskeleyMono
      fonts:
        - asset: assets/fonts/code/IoskeleyMono-Regular.ttf
    - family: DejaVuSansMono
      fonts:
        - asset: assets/fonts/code/DejaVuSansMono.ttf
  uses-material-design: true

