# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true

  # Quality signals are advisory and do not block review or merging.
  slop_detection:
    enabled: true
    include_all_authors: true
    label: status:quality-hold

  # Review automatically without an intake label; maintainers/Codex decide merges.
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    drafts: false
    labels: []

  finishing_touches:
    docstrings:
      enabled: false

  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: >-
        Follow Conventional Commits: type(scope): concise description. The scope
        may be omitted when it does not add useful context.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - name: Focused scope
        mode: warning
        instructions: >-
          Pass when every changed area is needed for the stated primary goal,
          its tests, or necessary documentation. Fail for unrelated fixes,
          opportunistic refactors, formatting churn, or speculative features.
          External non-trivial features, new packages, architecture changes, and
          all PRs over 50 files need a linked Issue or Prompt Request with
          maintainer scope agreement; a link alone is not agreement.
          Maintainer-authored PRs up to 50 files may record their scope decision
          in the PR body without a separate Issue. Small self-contained external
          fixes may use "None — reason". Cite the unrelated paths or missing scope
          agreement on failure. Do not infer quality from AI use or prose style.
      - name: Maintainable implementation
        mode: warning
        instructions: >-
          Fail for newly introduced unused code or dependencies, duplicate
          implementations of existing repository functionality, speculative
          extension points with no current caller, or fallback paths that hide
          failures and report success. Cite concrete code and its unnecessary
          cost or incorrect behavior. Pass when the change uses existing patterns
          or explains a necessary deviation. Do not fail on style preferences,
          AI authorship, or merely having an abstraction. Do not require rewrites
          or extra framework layers without a demonstrated problem.
      - name: UI evidence
        mode: warning
        instructions: >-
          Pass when the selected UI Evidence category matches the diff.
          User-visible text-only changes may use successful automated UI test
          evidence instead of images and must explain why visual evidence is not
          needed. The evidence must include a backticked `flutter test ...`
          command and its explicit successful result. Copy or localization
          changes alone are text-only. Changes to component placement, size,
          styling, visibility, interactive behavior, or state transitions are not
          text-only. Visual or interaction changes must include a GitHub-uploaded
          Before image, or "N/A — reason" for a new UI, plus an After image or
          recording and the tested device/platform. When mobile UI-area files
          change without a visible effect, the author must explain why.
      - name: Validation evidence
        mode: warning
        instructions: >-
          Pass when exact automated commands and results support the stated
          behavior, or "N/A — reason" explains a documentation-only or similarly
          low-impact change. For bug fixes, require a regression test that can
          catch the reported failure, or reproducible before/after validation
          when automation is impractical. Fail for placeholder results, claims
          contradicted by CI, or tests that only mirror implementation without
          checking observable behavior. Manual validation and platform/version
          are required above 10 files, for high-risk changes, and for OS-specific
          behavior; they are advisory for small low-risk changes otherwise.
          Inspect supplied evidence and test code; do not try to run tests here.
      - name: Breaking change documentation
        mode: warning
        instructions: >-
          Pass when user-facing changes and breaking changes to the WebSocket
          protocol, public APIs, CLI flags, environment variables, configuration,
          or release workflows are documented in the PR and CHANGELOG.md when
          applicable. Internal changes may explicitly state that this is not
          applicable.

  tools:
    github-checks:
      enabled: true
      timeout_ms: 900000

  path_filters:
    - "!apps/mobile/lib/**/*.g.dart"
    - "!apps/mobile/lib/**/*.gr.dart"
    - "!apps/mobile/lib/**/*.freezed.dart"
    - "!apps/mobile/lib/l10n/app_localizations*.dart"
    - "!**/build/**"
    - "!**/coverage/**"

  path_instructions:
    - path: "**"
      instructions: |
        Apply CONTRIBUTING.md's contribution quality bar. Focus on concrete
        correctness, scope, regression, and maintenance problems; avoid style
        nits, speculative improvements, and repeating CI diagnostics. AI use
        itself is allowed. Group related findings with a concrete path and fix.
        Findings are advisory. Maintainers or Codex assess concrete issues and
        may merge without CodeRabbit completion, approval, or passing checks.
    - path: "packages/bridge/src/**"
      instructions: |
        Focus on authentication and authorization boundaries, allowed-directory
        enforcement, path traversal, process lifecycle and cleanup, WebSocket
        compatibility, session isolation, and regression tests. Flag protocol
        changes that are not coordinated with the Flutter client.
    - path: "apps/mobile/lib/**"
      instructions: |
        Follow the project's feature-first Flutter architecture and existing
        Bloc/Cubit patterns. Check async lifecycle and disposal, mounted checks,
        loading/empty/error states, accessibility, and relevant widget or unit
        tests. Text-only changes may substitute successful automated UI test
        evidence and a concrete reason for images. For layout, styling, rendered
        component visibility, interactive behavior, or state transition changes,
        verify the PR includes Before/After evidence. Copy or localization changes
        alone remain text-only.
    - path: ".github/workflows/**"
      instructions: |
        Treat workflow changes as security-sensitive. Require least-privilege
        permissions, full-SHA action pinning, safe handling of untrusted PR data,
        and no execution of contributor-controlled code with write tokens.
    - path: "functions/**"
      instructions: |
        Focus on authentication, authorization, token and secret handling,
        Firestore access boundaries, input validation, abuse resistance, and
        backward compatibility with released clients.
    - path: "{scripts/**,.github/workflows/*release*,firestore.rules,firebase.json}"
      instructions: |
        Review release, signing, deployment, and production configuration changes
        as high risk. Flag secret exposure, overly broad permissions, destructive
        operations, and missing rollback or validation steps.

chat:
  auto_reply: true
