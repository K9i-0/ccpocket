name: markdown_kit
description: >-
  Markdown for AI chat in Flutter. Holds half-written syntax while a reply
  streams, and keeps text selection across blocks while the list scrolls.
version: 0.1.0
publish_to: none

screenshots:
  - description: A reply streaming into a chat, then selected across a list, a code block and a table.
    path: doc/demo.gif

topics:
  - markdown
  - widget
  - selection
  - streaming

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  markdown: ^7.3.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
