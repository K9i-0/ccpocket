name: markdown_kit
description: >-
  Standalone Flutter Markdown AST, parser, streaming splitter, selection engine,
  and renderer built solely on package:flutter/widgets.dart.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  markdown: ^7.3.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
