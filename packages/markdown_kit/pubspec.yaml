name: markdown_kit
description: >-
  GitHub-Flavored Markdown for Flutter with streaming support and text
  selection across blocks, built on package:flutter/widgets.dart only.
version: 0.1.0
publish_to: none

topics:
  - markdown
  - widget
  - selection
  - streaming

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  markdown: ^7.3.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
