name: markdown_kit
description: >-
  Markdown for AI chat in Flutter. Holds half-written syntax while a reply
  streams, and keeps text selection across blocks while the list scrolls.
version: 0.1.0
publish_to: none

screenshots:
  - description: A reply streaming into a chat, then selected across a list, a code block and a table.
    path: doc/demo.gif
  - description: Headings, lists, a task list, a code block, a table and an alert with the built-in theme.
    path: doc/blocks.png
  - description: A selection running from a list through a code block into a table, with handles and the built-in menu.
    path: doc/selection.png
  - description: Typeset math, alerts, a details section, keyboard keys, a quote and a footnote.
    path: doc/extras.png
  - description: The built-in dark theme.
    path: doc/dark.png

topics:
  - markdown
  - widget
  - selection
  - streaming

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  markdown: ^7.3.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
