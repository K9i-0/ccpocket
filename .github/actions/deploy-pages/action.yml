name: Deploy and verify Pages
description: Publish one exact artifact and verify the public update feed.
inputs:
  artifact-name:
    description: Unique artifact name for this run attempt
    required: true
outputs:
  page_url:
    description: Published Pages URL
    value: ${{ steps.deploy.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Deploy exact Pages artifact
      id: deploy
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      with:
        artifact_name: ${{ inputs.artifact-name }}
    - name: Verify public Sparkle content
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        PAGES_PUBLISHED_URL: ${{ steps.deploy.outputs.page_url }}
      with:
        script: |
          const fs = require('node:fs');
          const verify = require(`${process.env.GITHUB_WORKSPACE}/scripts/release/verify-pages.cjs`);
          await verify({
            pageUrl: process.env.PAGES_PUBLISHED_URL,
            expected: fs.readFileSync('docs/sparkle/appcast.xml'),
            core,
          });
