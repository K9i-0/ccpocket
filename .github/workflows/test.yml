name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test PR readiness policy
        run: node --test scripts/pr-readiness.test.mjs
      - name: Test release tools
        run: npm run test:release-tools

  mobile-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Flutter version from .mise.toml
        id: mise
        run: echo "flutter_version=$(grep 'flutter' .mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: dart analyze .
        working-directory: apps/mobile

  mobile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Flutter version from .mise.toml
        id: mise
        run: echo "flutter_version=$(grep 'flutter' .mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Generate SSH private key smoke credentials
        run: |
          mkdir -p tools/ssh-jump-smoke/generated
          ssh-keygen -t ed25519 -N "" -f tools/ssh-jump-smoke/generated/id_ed25519 -C ccpocket-smoke-test
      - name: Start SSH jump smoke containers
        run: docker compose -f tools/ssh-jump-smoke/docker-compose.yml up -d --build
      - name: Wait for SSH jump host
        run: |
          for _ in {1..30}; do
            nc -z 127.0.0.1 22220 && exit 0
            sleep 1
          done
          docker compose -f tools/ssh-jump-smoke/docker-compose.yml logs
          exit 1
      - name: Run SSH jump smoke test
        run: flutter test test/ssh_jump_smoke_test.dart
        working-directory: apps/mobile
        env:
          CCPOCKET_SSH_JUMP_SMOKE: "1"
          CCPOCKET_SSH_TARGET_HOST: target-sshd
          CCPOCKET_SSH_TARGET_PORT: "22"
          CCPOCKET_SSH_JUMP_HOST: 127.0.0.1
          CCPOCKET_SSH_JUMP_PORT: "22220"
          CCPOCKET_SSH_USERNAME: ccpocket
          CCPOCKET_SSH_PASSWORD: ccpocket
      - name: Run SSH Bridge tunnel smoke test
        run: flutter test test/ssh_bridge_tunnel_smoke_test.dart
        working-directory: apps/mobile
        env:
          CCPOCKET_SSH_BRIDGE_TUNNEL_SMOKE: "1"
          CCPOCKET_BRIDGE_TARGET_HOST: target-sshd
          CCPOCKET_BRIDGE_TARGET_PORT: "8765"
          CCPOCKET_SSH_JUMP_HOST: 127.0.0.1
          CCPOCKET_SSH_JUMP_PORT: "22220"
          CCPOCKET_SSH_USERNAME: ccpocket
          CCPOCKET_SSH_PASSWORD: ccpocket
      - name: Run SSH private key smoke test
        run: flutter test test/ssh_private_key_smoke_test.dart
        working-directory: apps/mobile
        env:
          CCPOCKET_SSH_PRIVATE_KEY_SMOKE: "1"
          CCPOCKET_SSH_PRIVATE_KEY_FILE: ../../tools/ssh-jump-smoke/generated/id_ed25519
          CCPOCKET_SSH_KEY_HOST: 127.0.0.1
          CCPOCKET_SSH_KEY_PORT: "22220"
          CCPOCKET_SSH_TARGET_HOST: target-sshd
          CCPOCKET_SSH_TARGET_PORT: "22"
          CCPOCKET_SSH_JUMP_HOST: 127.0.0.1
          CCPOCKET_SSH_JUMP_PORT: "22220"
          CCPOCKET_SSH_USERNAME: ccpocket
      - name: Stop SSH jump smoke containers
        if: always()
        run: docker compose -f tools/ssh-jump-smoke/docker-compose.yml down -v

  mobile-test:
    name: mobile-test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      TOTAL_SHARDS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Flutter version from .mise.toml
        id: mise
        run: echo "flutter_version=$(grep 'flutter' .mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Restore Flutter test cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile/build/test_cache
          key: ${{ runner.os }}-flutter-test-${{ env.TOTAL_SHARDS }}-${{ matrix.shard }}-${{ hashFiles('.mise.toml', 'apps/mobile/pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-flutter-test-${{ env.TOTAL_SHARDS }}-${{ matrix.shard }}-${{ hashFiles('.mise.toml', 'apps/mobile/pubspec.lock') }}-
      - name: Run Flutter test shard
        shell: bash
        working-directory: apps/mobile
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          mapfile -t files < <(
            find test -type f -name '*_test.dart' | sort \
              | awk -v n="$TOTAL_SHARDS" -v i="$SHARD_INDEX" '(NR - 1) % n == i'
          )
          echo "shard $SHARD_INDEX/$TOTAL_SHARDS: ${#files[@]} files"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no test files assigned to shard $SHARD_INDEX"
            exit 1
          fi
          flutter test --no-pub "${files[@]}"

  mobile:
    name: mobile
    if: always()
    needs: [mobile-analyze, mobile-smoke, mobile-test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify mobile jobs
        env:
          ANALYZE_RESULT: ${{ needs.mobile-analyze.result }}
          SMOKE_RESULT: ${{ needs.mobile-smoke.result }}
          TEST_RESULT: ${{ needs.mobile-test.result }}
        run: |
          test "$ANALYZE_RESULT" = success
          test "$SMOKE_RESULT" = success
          test "$TEST_RESULT" = success

  mobile-windows-test:
    name: mobile-windows-test (${{ matrix.shard }}/6)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      TOTAL_SHARDS: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Flutter version from .mise.toml
        id: mise
        shell: pwsh
        run: |
          $mise = Get-Content .mise.toml -Raw
          if ($mise -notmatch 'flutter\s*=\s*"([^"]+)"') {
            Write-Error "Could not read Flutter version from .mise.toml"
            exit 1
          }
          "flutter_version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: false
          pub-cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Restore Flutter test cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile/build/test_cache
          key: ${{ runner.os }}-flutter-test-${{ env.TOTAL_SHARDS }}-${{ matrix.shard }}-${{ hashFiles('.mise.toml', 'apps/mobile/pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-flutter-test-${{ env.TOTAL_SHARDS }}-${{ matrix.shard }}-${{ hashFiles('.mise.toml', 'apps/mobile/pubspec.lock') }}-
      - name: Run Flutter test shard on Windows
        shell: pwsh
        working-directory: apps/mobile
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          $weightUnit = 2048
          $allFiles = @(Get-ChildItem test -Recurse -File -Filter '*_test.dart' | Sort-Object @{ Expression = { [math]::Ceiling($_.Length / $weightUnit) }; Descending = $true }, FullName)
          $shards = @(0..([int]$env:TOTAL_SHARDS - 1) | ForEach-Object {
            [PSCustomObject]@{
              Index = $_
              Weight = [long]0
              Bytes = [long]0
              Files = [System.Collections.Generic.List[string]]::new()
            }
          })
          foreach ($file in $allFiles) {
            $target = $shards | Sort-Object Weight, Index | Select-Object -First 1
            [void]$target.Files.Add($file.FullName)
            $target.Weight += [math]::Ceiling($file.Length / $weightUnit)
            $target.Bytes += $file.Length
          }
          $selected = $shards[[int]$env:SHARD_INDEX]
          $files = @($selected.Files)
          Write-Host "shard $env:SHARD_INDEX/$env:TOTAL_SHARDS`: $($files.Count) files, $($selected.Bytes) bytes"
          if ($files.Count -eq 0) {
            Write-Error "no test files assigned to shard $env:SHARD_INDEX"
            exit 1
          }
          flutter test --no-pub @files
          exit $LASTEXITCODE

  mobile-windows:
    name: mobile-windows
    if: always()
    needs: [mobile-windows-test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Windows mobile test jobs
        env:
          TEST_RESULT: ${{ needs.mobile-windows-test.result }}
        run: test "$TEST_RESULT" = success

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Bridge tests
        run: npm run test:bridge
      - name: Type check Bridge
        run: npx tsc --noEmit -p packages/bridge/tsconfig.json
      - name: Build Bridge
        run: npm run bridge:build

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Run Functions tests
        run: npm --prefix functions test
      - name: Type check Functions
        run: npm --prefix functions run typecheck
      - name: Build Functions
        run: npm --prefix functions run build
