name: Submit Store Review
run-name: Submit Store Review · ${{ inputs.platform }} · ${{ inputs.version }}+${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Store to submit'
        required: true
        type: choice
        options:
          - both
          - ios
          - android
      version:
        description: 'Marketing version (X.Y.Z)'
        required: true
        type: string
      build_number:
        description: 'Existing release build number / Android versionCode'
        required: true
        type: string
      confirmation:
        description: 'Type SUBMIT X.Y.Z+N using the exact version and build above'
        required: true
        type: string
      expected_ref_sha:
        description: 'Exact 40-character commit SHA approved for this submission'
        required: true
        type: string
      ios_release_type:
        description: 'KEEP preserves an existing setting; a newly created version uses MANUAL'
        required: true
        type: choice
        default: KEEP
        options:
          - KEEP
          - MANUAL
          - AFTER_APPROVAL
      ios_review_scope:
        description: 'Only APP_VERSION_ONLY is automated; new IAP/subscription review items require a separate flow'
        required: true
        type: choice
        default: UNCONFIRMED
        options:
          - UNCONFIRMED
          - APP_VERSION_ONLY
          - INCLUDES_NEW_IAP_OR_SUBSCRIPTION
      android_release_status:
        description: 'Production rollout mode after review approval'
        required: true
        type: choice
        default: inProgress
        options:
          - inProgress
          - completed
      android_user_fraction:
        description: 'Initial production fraction when status is inProgress (0 < value < 1)'
        required: true
        type: string
        default: '0.1'

permissions:
  actions: read
  contents: read

concurrency:
  group: store-review-submission
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify immutable review ref
        env:
          EXPECTED_REF_SHA: ${{ inputs.expected_ref_sha }}
        run: |
          if [[ ! "$EXPECTED_REF_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_ref_sha must be a full lowercase commit SHA"
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_REF_SHA" ]]; then
            echo "::error::Review ref moved: expected $EXPECTED_REF_SHA, checked out $GITHUB_SHA"
            exit 1
          fi

      - name: Validate immutable release candidate and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          CONFIRMATION: ${{ inputs.confirmation }}
          IOS_RELEASE_TYPE: ${{ inputs.ios_release_type }}
          IOS_REVIEW_SCOPE: ${{ inputs.ios_review_scope }}
          ANDROID_RELEASE_STATUS: ${{ inputs.android_release_status }}
          ANDROID_USER_FRACTION: ${{ inputs.android_user_fraction }}
        run: |
          scripts/store-review/preflight.sh \
            "$PLATFORM" \
            "$VERSION" \
            "$BUILD_NUMBER" \
            "$CONFIRMATION" \
            "$IOS_RELEASE_TYPE" \
            "$ANDROID_RELEASE_STATUS" \
            "$ANDROID_USER_FRACTION" \
            "$IOS_REVIEW_SCOPE"

  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: store-review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up asc
        uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d # v1
        with:
          version: 3.5.1

      - name: Verify asc version
        run: asc --version

      - name: Submit existing iOS build for App Review
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_STRICT_AUTH: 'true'
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_TYPE: ${{ inputs.ios_release_type }}
        run: scripts/store-review/submit-ios.sh "$VERSION" "$BUILD_NUMBER" "$RELEASE_TYPE"

  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store-review
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile

      - name: Promote exact Android build and send changes for review
        env:
          GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}
          ANDROID_VERSION_CODE: ${{ inputs.build_number }}
          ANDROID_RELEASE_STATUS: ${{ inputs.android_release_status }}
          ANDROID_USER_FRACTION: ${{ inputs.android_user_fraction }}
        run: bundle exec fastlane android submit_review
