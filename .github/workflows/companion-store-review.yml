name: Companion Store Review
run-name: Companion Store Review · ${{ inputs.app }} · ${{ inputs.operation }} · ${{ inputs.platform }} · ${{ inputs.version }}+${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      app:
        type: choice
        options: [T2QR, Bookmark-Safe]
        required: true
      operation:
        type: choice
        options: [inspect, submit]
        default: inspect
        required: true
      platform:
        type: choice
        options: [both, ios, android]
        default: both
        required: true
      version:
        type: string
        description: Exact existing marketing version (submit only)
      build_number:
        type: string
        description: Exact existing build number (submit only)
      candidate_sha:
        type: string
        description: Full source commit SHA verified by the invoking agent
      expected_ref_sha:
        type: string
        description: Full ccpocket workflow SHA
        required: true
      release_notes_json:
        type: string
        description: JSON with ios en-US/ja and android en-US/ja-JP notes
        default: '{}'
      confirmation:
        type: string
        description: SUBMIT app X.Y.Z+N (generated by the invoking agent)

permissions:
  contents: read

concurrency:
  group: companion-store-${{ inputs.app }}
  cancel-in-progress: false

env:
  TARGET_APP: ${{ inputs.app }}
  OPERATION: ${{ inputs.operation }}
  PLATFORM: ${{ inputs.platform }}
  VERSION: ${{ inputs.version }}
  BUILD_NUMBER: ${{ inputs.build_number }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  EXPECTED_REF_SHA: ${{ inputs.expected_ref_sha }}
  RELEASE_NOTES_JSON: ${{ inputs.release_notes_json }}
  CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/store-review/apps/prepare.py
      - id: matrix
        run: |
          if [[ "$PLATFORM" == both ]]; then
            echo 'platforms=["ios","android"]' >> "$GITHUB_OUTPUT"
          else
            printf 'platforms=["%s"]\n' "$PLATFORM" >> "$GITHUB_OUTPUT"
          fi
  store:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.preflight.outputs.platforms) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: store-review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/store-review/apps/prepare.py
      - name: Set up asc
        if: matrix.platform == 'ios'
        uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d
        with:
          version: 4.9.2
      - name: Set up Ruby
        if: matrix.platform == 'android'
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: scripts/store-review/apps
      - name: Inspect or submit iOS
        if: matrix.platform == 'ios'
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_STRICT_AUTH: 'true'
          ASC_TELEMETRY_DISABLED: '1'
        run: |
          mkdir -p store-state
          if [[ "$OPERATION" == inspect ]]; then
            scripts/store-review/inspect-ios.sh store-state/ios.json
          else
            scripts/store-review/submit-ios.sh "$VERSION" "$BUILD_NUMBER" "$STORE_RELEASE_TYPE"
          fi
      - name: Inspect or submit Android
        if: matrix.platform == 'android'
        working-directory: scripts/store-review/apps
        env:
          GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}
          STORE_STATE_OUTPUT: ${{ github.workspace }}/store-state/android.json
          ANDROID_VERSION_CODE: ${{ inputs.build_number }}
          ANDROID_RELEASE_STATUS: completed
        run: |
          if [[ "$OPERATION" == inspect ]]; then
            bundle exec fastlane android store_state
          else
            bundle exec fastlane android submit_review
          fi
      - name: Save inspected state
        if: inputs.operation == 'inspect'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.app }}-${{ matrix.platform }}-store-state
          path: store-state/*.json
          if-no-files-found: error
          retention-days: 1
      - name: Record successful operation
        env:
          STORE_PLATFORM: ${{ matrix.platform }}
        run: |
          printf '## %s / %s\n\nOperation: %s\n\nCandidate: %s+%s\n\nSource: %s\n\nWorkflow: %s\n' \
            "$TARGET_APP" "$STORE_PLATFORM" "$OPERATION" "$VERSION" "$BUILD_NUMBER" \
            "$CANDIDATE_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
