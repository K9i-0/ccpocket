name: Upload Store Metadata
run-name: Upload Store Metadata · ${{ inputs.platform }} · ${{ inputs.ios_version || inputs.android_version_code || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to upload'
        required: true
        type: choice
        options:
          - both
          - ios
          - android
      upload_screenshots:
        description: 'Upload screenshots'
        required: false
        type: boolean
        default: true
      upload_metadata:
        description: 'Upload metadata (title, description, etc.)'
        required: false
        type: boolean
        default: true
      upload_images:
        description: 'Upload images (icon, feature graphic, etc.)'
        required: false
        type: boolean
        default: false
      android_version_code:
        description: 'Android versionCode to update (defaults to latest android tag build number)'
        required: false
        type: string
        default: ''
      ios_version:
        description: 'Exact iOS App Store version to update (required when platform includes iOS)'
        required: false
        type: string
        default: ''
      expected_ref_sha:
        description: 'Exact 40-character commit SHA approved for this upload'
        required: true
        type: string

permissions:
  contents: read

jobs:
  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify immutable review ref
        env:
          EXPECTED_REF_SHA: ${{ inputs.expected_ref_sha }}
        run: |
          if [[ ! "$EXPECTED_REF_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_ref_sha must be a full lowercase commit SHA"
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_REF_SHA" ]]; then
            echo "::error::Review ref moved: expected $EXPECTED_REF_SHA, checked out $GITHUB_SHA"
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile

      - name: Upload iOS metadata
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_APP_VERSION: ${{ inputs.ios_version }}
          SKIP_METADATA: ${{ inputs.upload_metadata == false }}
          SKIP_SCREENSHOTS: ${{ inputs.upload_screenshots == false }}
          SPACESHIP_SCREENSHOT_UPLOAD_TIMEOUT: "5"
        run: bundle exec fastlane ios metadata

  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify immutable review ref
        env:
          EXPECTED_REF_SHA: ${{ inputs.expected_ref_sha }}
        run: |
          if [[ ! "$EXPECTED_REF_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_ref_sha must be a full lowercase commit SHA"
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_REF_SHA" ]]; then
            echo "::error::Review ref moved: expected $EXPECTED_REF_SHA, checked out $GITHUB_SHA"
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile

      - name: Read Android version code
        id: android_version
        run: |
          version=$(git tag -l 'android/v*' --sort=-v:refname | head -1 | sed 's|^android/v||')
          if [ -z "$version" ]; then
            version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          fi
          echo "code=${version##*+}" >> "$GITHUB_OUTPUT"

      - name: Validate metadata
        run: |
          error=0
          for lang in en-US ja-JP zh-CN ko-KR; do
            file="fastlane/metadata/android/${lang}/short_description.txt"
            if [ -f "$file" ]; then
              len=$(wc -m < "$file" | tr -d ' ')
              if [ "$len" -gt 80 ]; then
                echo "::error::${file} is ${len} chars (max 80)"
                error=1
              fi
            fi
            file="fastlane/metadata/android/${lang}/full_description.txt"
            if [ -f "$file" ]; then
              len=$(wc -m < "$file" | tr -d ' ')
              if [ "$len" -gt 4000 ]; then
                echo "::error::${file} is ${len} chars (max 4000)"
                error=1
              fi
            fi
          done
          exit $error

      - name: Upload Android metadata
        env:
          GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}
          SKIP_UPLOAD_METADATA: ${{ inputs.upload_metadata == false }}
          SKIP_UPLOAD_SCREENSHOTS: ${{ inputs.upload_screenshots == false }}
          SKIP_UPLOAD_IMAGES: ${{ inputs.upload_images == false }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code || steps.android_version.outputs.code }}
        run: bundle exec fastlane android metadata
