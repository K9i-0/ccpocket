name: PR Readiness

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
  workflow_run:
    workflows: [Test]
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]
  # Fork review events receive a read-only token and are skipped below. Poll
  # from the default branch so CodeRabbit can still promote external PRs.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: pr-readiness-${{ github.repository }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate PR readiness
    if: >-
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0])) &&
      (github.event_name != 'pull_request_review' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # Security: pull_request_target has a write token. Always run the checker
      # from the default branch and never checkout or execute contributor code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate intake, CI, and CodeRabbit gates
        run: node scripts/pr-readiness.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAINTAINER_LOGIN: K9i-0
