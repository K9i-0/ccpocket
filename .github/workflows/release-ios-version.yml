name: Release iOS Version
run-name: Release iOS · ${{ inputs.version }}+${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved App Store version (X.Y.Z)'
        required: true
        type: string
      build_number:
        description: 'Exact approved build number'
        required: true
        type: string
      confirmation:
        description: 'Type RELEASE X.Y.Z+N using the exact version and build above'
        required: true
        type: string
      expected_ref_sha:
        description: 'Exact workflow ref SHA approved for this release'
        required: true
        type: string
      expected_tag_sha:
        description: 'Exact release candidate commit SHA referenced by the iOS tag'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-version-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ios-version-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify immutable release request
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_REF_SHA: ${{ inputs.expected_ref_sha }}
          EXPECTED_TAG_SHA: ${{ inputs.expected_tag_sha }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must use X.Y.Z format"
            exit 1
          fi
          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::build_number must be a positive integer"
            exit 1
          fi
          if [[ "$CONFIRMATION" != "RELEASE ${VERSION}+${BUILD_NUMBER}" ]]; then
            echo "::error::confirmation must exactly match RELEASE ${VERSION}+${BUILD_NUMBER}"
            exit 1
          fi
          if [[ ! "$EXPECTED_REF_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_ref_sha must be a full lowercase commit SHA"
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_REF_SHA" ]]; then
            echo "::error::Release ref moved: expected $EXPECTED_REF_SHA, checked out $GITHUB_SHA"
            exit 1
          fi
          if [[ ! "$EXPECTED_TAG_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_tag_sha must be a full lowercase commit SHA"
            exit 1
          fi

          tag="ios/v${VERSION}+${BUILD_NUMBER}"
          tag_sha=$(git rev-parse --verify "refs/tags/${tag}^{commit}") || {
            echo "::error::Missing immutable release tag ${tag}"
            exit 1
          }
          if [[ "$tag_sha" != "$EXPECTED_TAG_SHA" ]]; then
            echo "::error::${tag} moved: expected $EXPECTED_TAG_SHA, resolved $tag_sha"
            exit 1
          fi
          tagged_version=$(git show "${tag}:apps/mobile/pubspec.yaml" | sed -n 's/^version: //p')
          if [[ "$tagged_version" != "${VERSION}+${BUILD_NUMBER}" ]]; then
            echo "::error::${tag} contains pubspec version ${tagged_version}"
            exit 1
          fi

      - name: Set up asc
        uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d # v1
        with:
          version: 6.3.0

      - name: Verify asc version
        run: asc --version

      - name: Release exact approved iOS version
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_STRICT_AUTH: 'true'
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: scripts/store-review/release-ios.sh "$VERSION" "$BUILD_NUMBER"
