name: Inspect Store State
run-name: Inspect Store State · ${{ inputs.platform }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Store state to inspect'
        required: true
        type: choice
        default: both
        options:
          - both
          - ios
          - android

permissions:
  contents: read

concurrency:
  group: inspect-store-state
  cancel-in-progress: false

jobs:
  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up asc
        uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d # v1
        with:
          version: 3.5.1

      - name: Inspect live App Store version
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_STRICT_AUTH: 'true'
          ASC_TELEMETRY_DISABLED: '1'
        run: scripts/store-review/inspect-ios.sh store-state/ios.json

      - name: Inspect ready iOS review submissions
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_STRICT_AUTH: 'true'
          ASC_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          mkdir -p store-state/ios-review
          asc review submissions-list \
            --app 6759188790 \
            --platform IOS \
            --state READY_FOR_REVIEW \
            --include app,items,appStoreVersionForReview \
            --item-fields appStoreVersion \
            --paginate \
            --output json > store-state/ios-review/ready.json
          for submission_id in \
            721245c8-889f-4706-b79c-8ba518c2e007 \
            db674c2a-eb2c-4caa-96f3-7a0da995c553; do
            asc review submissions-get \
              --id "$submission_id" \
              --include app,items,appStoreVersionForReview \
              --item-fields appStoreVersion \
              --output json > "store-state/ios-review/submission-${submission_id}.json"
            asc review items-list \
              --submission "$submission_id" \
              --fields state,appStoreVersion \
              --include appStoreVersion \
              --paginate \
              --output json > "store-state/ios-review/items-${submission_id}.json"
          done

      - name: Upload iOS store state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-store-state
          path: store-state/ios.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload iOS review state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-review-state
          path: store-state/ios-review
          if-no-files-found: error
          retention-days: 1

  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile

      - name: Inspect live Google Play version
        env:
          GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}
          STORE_STATE_OUTPUT: ${{ github.workspace }}/apps/mobile/store-state/android.json
        run: bundle exec fastlane android store_state

      - name: Upload Android store state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-store-state
          path: apps/mobile/store-state/android.json
          if-no-files-found: error
          retention-days: 1
