name: Formal check
on:
  pull_request:
    paths:
      - formal/**
      - packages/bridge/src/sdk-process.ts
      - .github/workflows/formal-check.yml
  push:
    branches: [main]
    paths:
      - formal/**
      - packages/bridge/src/sdk-process.ts
      - .github/workflows/formal-check.yml
jobs:
  permission-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check the permission-flow model against SdkProcess
        run: bash formal/permission-flow/quint/check.sh
